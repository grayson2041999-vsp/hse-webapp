<script src="assets/hse-activity.js"></script>

  <!-- Router theo hash: index.html#slug -->
  <script>
  (function(){
    // Các trang nghiệp vụ lớn đứng riêng — điều hướng sang file HTML riêng
    var STANDALONE = {
      "tai-nan-su-co":1, "bao-chay-tu-dong":1, "kiem-tra-cac-cap":1, "moi-truong":1,
      "ke-hoach":1, "cap-phat-bhld":1, "kham-suc-khoe":1
    };
    // Các trang nhẹ do index.html render qua app.js
    var SHELL = {
      "tong-quan":1, "sop":1, "huan-luyen-dao-tao":1, "quan-ly-nha-thau":1,
      "quan-ly-thiet-bi":1, "quan-tri-he-thong":1, "tra-cuu-atvsld":1,
      "nhap-svodka":1
    };

    function route(){
      var slug = (location.hash.slice(1) || "tong-quan").trim();
      // Trang lớn → mở file riêng
      if(STANDALONE[slug]){ location.href = slug + ".html"; return; }
      // Slug lạ hoặc đã bỏ (vd bao-cao) → về trang chủ
      if(!SHELL[slug]) slug = "tong-quan";
      if(slug === "tong-quan") HSE.renderDashboard();
      else HSE.renderPage(slug);
      window.scrollTo(0, 0);
    }

    window.addEventListener("hashchange", route);

    // supabase-config.js là <script type="module"> nên trình duyệt HOÃN nó lại,
    // chỉ chạy sau khi đọc xong HTML. Nếu route() chạy ngay tại đây thì các trang
    // hỏi DB.isReady() sẽ thấy "chưa sẵn sàng" và BỎ QUA LUÔN việc tải dữ liệu
    // (chúng chỉ hỏi một lần, không thử lại) → danh sách trống trên máy chưa có cache.
    // DOMContentLoaded theo chuẩn luôn đợi module chạy xong, nên đợi nó là đủ.
    // Cách này cũng khớp với 7 trang riêng lẻ vốn đã khởi động bằng DOMContentLoaded.
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", route, { once: true });
    } else {
      route();
    }
  })();
  </script>
</body>
</html>
